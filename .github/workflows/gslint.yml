name: Gosu Lint

env:
  GSLINT_VERSION: '0.39.0'

on:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Download gslint JAR
        run: |
          gh release download v${{ env.GSLINT_VERSION }} \
            --repo ronosaurus/gslint-releases \
            --pattern 'gslint-${{ env.GSLINT_VERSION }}-gosu-1.18.7.jar'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run gslint
        run: |
          java -jar gslint-${{ env.GSLINT_VERSION }}-gosu-1.18.7.jar lint \
            --src-root . \
            --include HelloWorld.gs \
            --rules print-statement,empty-catch,public-field \
            --format json \
            > gslint.json
        continue-on-error: true

      - name: Post PR comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python .github/workflows/post_lint_comment.py \
            "${{ github.repository }}" \
            "${{ github.event.pull_request.head.sha }}" \
            "${{ github.event.pull_request.number }}"
