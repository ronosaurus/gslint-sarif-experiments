name: Gosu Lint

env:
  GSLINT_VERSION: '0.39.0'

on:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Download gslint JAR
        run: |
          gh release download v${{ env.GSLINT_VERSION }} \
            --repo ronosaurus/gslint-releases \
            --pattern 'gslint-${{ env.GSLINT_VERSION }}-gosu-1.18.7.jar'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run gslint
        run: |
          java -jar gslint-${{ env.GSLINT_VERSION }}-gosu-1.18.7.jar lint \
            --src-root . \
            --include HelloWorld.gs \
            --rules print-statement,empty-catch,public-field \
            --format json \
            > gslint.json
        continue-on-error: true

      - name: Post PR comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TOTAL=$(jq '[.files[].violations | to_entries[].value[]] | length' gslint.json)
          if [ "$TOTAL" -eq 0 ]; then
            echo "No violations found, skipping comment."
            exit 0
          fi

          REPO="${{ github.repository }}"
          SHA="${{ github.event.pull_request.head.sha }}"
          NUMBER="${{ github.event.pull_request.number }}"

          jq -n --arg repo "$REPO" --arg sha "$SHA" \
            --slurpfile data gslint.json \
            '{body: (
              "## gslint results\n\n" +
              ([$data[0].files[] |
                .file as $file |
                "**\($file)**\n" +
                ([.violations | to_entries[] | .value[] |
                  "- [Line \(.line)](https://github.com/\($repo)/blob/\($sha)/\($file)#L\(.line)): \(.message)"
                ] | join("\n"))
              ] | join("\n\n"))
            )}' | \
          gh api "repos/$REPO/issues/$NUMBER/comments" \
            --method POST \
            --input -
